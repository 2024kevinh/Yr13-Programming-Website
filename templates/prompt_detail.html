{% extends "base.html" %}
{% block content %}

<div class="prompt-page">

    <a href="{{ url_for('main.home') }}" class="back-link">
        ← Back
    </a>

    <div class="prompt-header">

        <div>

            <h1>{{ prompt.title }}</h1>

            <p class="creator">
                by @{{ prompt.user.username }}
            </p>

        </div>

        <div class="prompt-actions">

            <button class="like-btn">

                <span class="heart">❤</span>

                <span class="like-count">

                    {{ prompt.likes }}

                </span>

            </button>

            <button class="save-btn">

                ☆

            </button>

        </div>

    </div>

    <div class="image-card">

        <img
            class="prompt-preview"
            src="{{ url_for('static', filename=prompt.image_url) }}">

    </div>

    <div class="description-card">

        <h3>About this Prompt</h3>

        <p>{{ prompt.description }}</p>

    </div>

    <div class="upload-card">

        <h3>Try this Prompt</h3>

        <form method="POST"
              enctype="multipart/form-data">

            <input type="file"
                   name="image">

            <button type="submit">

                Generate

            </button>

        </form>

    </div>

    {% if prompt.uploaded_image %}

    <div class="result-card">

        <h2>Your Result</h2>

        <img
        src="{{ url_for('static',
        filename=prompt.uploaded_image) }}">

    </div>

    {% endif %}

</div>

{% endblock %}
